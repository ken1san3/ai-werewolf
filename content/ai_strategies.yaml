default:
  disclosure: open
  aim: 本人の陣営の勝利を目指し、生存者へ根拠を示して議論する。
  text: 本人の役職の説明と受信情報に従い、推理・質問・投票で自分の陣営の勝利を目指す。
roles:
  werewolf: &wolf
    disclosure: endgame_vote
    aim: 人狼陣営の勝利。通知された仲間は味方で、生存する村側を襲撃する。公開では村人を装う。
    text: >-
      村人として目立たないように振る舞う。強すぎる主張、不自然な沈黙、仲間のかばいすぎを避け、多数の疑いに乗る。
      仲間と夜に相談し、襲撃と投票を合わせる。村側の役職を騙ってよく、名乗る役職と偽の結果は公開発言に使ってよい。
      本当の役職・陣営・自分の襲撃・仲間は普段は明かさず、終盤の票合わせで勝てる局面だけ正体を明かす。
      判断JSONでは本人が人狼であることと通知された仲間を事実として維持する。村の勝利を本人の目的にせず、公開の村人の演技と本人の勝利方針を分ける。
      仲間を人狼候補として探したり、仲間の処刑を自分から推進しない。公開では「村を混乱させる」「騙る」「私の仲間」など本人の裏の狙いを説明しない。
      偽COの役職と偽結果を一度決めたら継続する。騙る役職の公開ルールに沿う結果を出し、他人の公称と本人の非公開の事実を混ぜない。
      秘密の相談では生存する村側の対象を仲間に提案する。狂人のCOなど公開の味方候補を襲撃対象から外す方針で相談する。
  wise_werewolf: *wolf
  greedy_werewolf: *wolf
  madman: &helper
    disclosure: endgame_vote
    aim: 人狼陣営の勝利。公開では村側を騙り、人狼が処刑されないよう村側の票を乱す。
    text: >-
      人狼の勝利を助ける。占い師を騙るなど、偽のCOと結果で村を混乱させ、人狼が処刑されないよう投票する。
      知らない人狼の正体を事実として決めつけない。名乗る役職と偽の結果は公開してよい。
      本当の役職・陣営は普段隠し、終盤の票合わせの局面だけ明かす。
      判断JSONでは人狼陣営の勝利を本人の目的として維持する。村側の推理は公開で演じる立場であり、本当に人狼を処刑する狙いにはしない。
      偽COでは自分が本物であるかのように役職と結果だけを話す。「偽の結果」「騙って混乱させる」「人狼を救うのが私の戦略」と公開で言わない。
      騙る役職と結果を継続し、その役職の公開ルールに沿った判定を作る。占いの白は狂人も含み、霊能は処刑・突然死した人だけを対象にする。
      最終3人など票合わせの局面なら狂人COして人狼へ呼びかけ、村側の同じ生存者へ投票を合わせる。
  fanatic: *helper
  whispering_madman: *helper
  guard:
    disclosure: pressure
    aim: 村陣営の勝利。自分は狩人のまま隠れ、処刑圧力にはCOと実際の護衛先で反論する。
    text: >-
      普段は正体と護衛先を隠し、村側の推理と質問に参加する。
      自分への処刑・投票の呼びかけが出たら、投票前に狩人COし、自分が実際に選んだ護衛先を示して処刑を避ける。
      初日に圧力でCOする場合はまだ護衛していないと伝える。対抗狩人COにも自分の役職と護衛履歴で反論する。護衛成功を受信していなければ成功とは言わない。
      自分が狩人であることは判断JSONで維持する。「狩人さん」と他人へ自分の仕事を頼まない。正体を隠す昼は護衛の話で能力をほのめかさず、公開の疑い・投票理由について話す。
  seer:
    disclosure: open
    aim: 村陣営の勝利。自分は占い師で、受信済みの結果をCOして出す。白は村側確定ではない。
    text: >-
      占い師COをして、自分がサーバから受け取った対象と結果を公開する。初夜の結果も公表できる。
      人狼ではない結果でも狂人の可能性は残る。他人のCOは真実と決めつけず、受信していない結果は作らない。
      自分は占い師のまま推理し、他人の役職や発言者IDと取り違えない。初夜がサーバの自動選択なら誰が選んだ理由かを作らず、自分の初夜結果の対象を自分自身だと読み替えない。
  medium:
    disclosure: open
    aim: 村陣営の勝利。自分は霊能者で、初夜は結果なし。受信した処刑死者の結果だけを出す。
    text: >-
      霊能者COをして、自分がサーバから受け取った死者の対象と結果を公開する。
      初夜は行動できないが、結果がなくても霊能COはできる。生存者や夜の襲撃で死んだ人は判定できず、死因や襲撃した人も分からない。霊能の能力で人を殺すこともない。
      受信していない結果は作らず、他人の占い結果を自分の霊能結果にしない。
  villager: &village
    disclosure: open
    aim: 村陣営の勝利。自分に能力はなく、生存者の推理や質問で人狼を探す。
    text: 特別な能力はない。推理と質問で人狼を探し、他人の発言を受けて根拠を示す。占いや護衛を行ったとは言わない。
  baker:
    disclosure: open
    text: 夜に対象を選ぶ能力はない。サーバのパン配布通知と公開の議論を根拠に推理し、市民陣営の勝利を目指す。
  nekomata:
    disclosure: pressure
    text: 正体は普段隠す。処刑されそうなら役職と道連れの危険を説明して処刑を避け、村の勝利を目指す。
  fox:
    disclosure: hidden
    text: 本当の正体を隠して生き残る。村側として推理し、必要なら村側の役職を騙る。占いと処刑を避ける。

rule_text:
  first_night_seer:
    none: 初夜には占い師も占いをせず、占い結果を受け取りません。
    free: 初夜には占い師がサーバの候補から一人を選んで占います。
    random_white: 初夜には占い師だけがサーバの選んだ一人の「人狼ではない」という結果を受け取ります。相手を選ばず、初夜に人狼という結果は出ません。
  public_co_rule: 昼は結果がまだなくてもCOできます。COと能力の使用時期は別です。人狼ではない判定は市民という役職や村陣営の確定ではありません。霊能結果は死因・襲撃者・投票した人を教えません。
  medium_notification: 霊能の結果を受け取る時期は{timing}です。
  phase_names:
    night: 夜
    dawn: 夜明け
  vote_reveal:
    hidden: 個人の投票先は非公開で、公開されるのは集計だけです。誰が誰に投票したかを断定しないでください。
    live: 個人の投票先は公開されます。サーバの通知を確認してください。
    after: 個人の投票先は投票終了後に公開されます。サーバの通知を確認してください。
result_words:
  wolf: 人狼
  not_wolf: 人狼ではない（狂人の可能性は残る）
result_events:
  INSPECT_RESULT: 占い結果
  MEDIUM_RESULT: 霊能結果
  INSPECT_ROLE_RESULT: 役職を調べた結果
  INSPECT_DEAD_ROLE_RESULT: 死者の役職を調べた結果
  GUARD_SUCCEEDED: 護衛成功
ability_names:
  inspect: 占い
  medium_inspect: 処刑死者・突然死者の霊能判定
  protect: 護衛
  attack: 襲撃
ability_report_words:
  inspect: '占|調査|調べ|判定'
  medium_inspect: '霊能|霊媒|調査|調べ|判定'
  protect: '護衛|守'
  attack: '襲撃|襲った|襲う'

role_claims:
  人狼:
    aliases: [狼]
    ability_patterns:
      - '(?:私(?:たち)?|自分)(?:は|が|で|[、,])[^。！？]*(?:襲撃(?:した|しました)(?!\s*(?:狼|人狼|者|相手))|襲撃します|襲撃する|襲った(?!\s*(?:狼|人狼|者|相手))|襲う|共同襲撃|player-\d+\s*(?:さん)?\s*(?:への|を)\s*襲撃で|襲撃に(?:関与|参加))'
      - '(?:私(?:たち)?|自分)の(?:襲撃|仲間の人狼|人狼仲間)'
      - '(?:昨夜|本夜|今夜)の襲撃は\s*私(?:たち)?(?:と\s*player-\d+|が[^。！？]*(?:行|担当))'
    negative_patterns:
      - '(?:襲撃した|襲撃する|襲った)(?:の)?(?:では(?:ない|ありません)|とは言っていない)'
  狩人:
    ability_patterns:
      - '(?:私|僕|俺|自分)(?:は|が|も|[、,])[^。！？]*護衛(?:した|しました|します|する|して)'
      - '(?:^|(?:私|僕|俺|自分)(?:は|が))[^。！？]*(?:初夜|昨夜|今夜|本夜)[^。！？]*player-\d+[^。！？]*(?:護衛(?:した|しました|します)|守(?:った|りました|ります))'
      - '(?:私|僕|俺|自分)の(?:護衛|守った相手)'
      - '護衛成功通知(?:は|が|を)'
      - '^\s*(?:昨夜|第\d+夜)(?:は|、)?\s*player-\d+[^。！？]*護衛'
    negative_patterns:
      - '護衛(?:した|しました|する)(?:の)?(?:では(?:ない|ありません)|とは言っていない)'
team_claim_patterns:
  - '(?:私は|僕は|俺は|^|[。！？]\s*)(?:人狼|狼)陣営(?:です|に属|の一員)'
  - '(?:私|僕|俺|自分)(?:は|が)[^。！？]*(?:人狼の勝利を助け|人狼を救う|人狼陣営を支援)'
  - '(?:人狼の勝利を助け|人狼を救う|村を混乱させ|村の混乱を深め)[^。！？]*(?:私|僕|俺|自分)の(?:戦略|目的|仕事|役目|真意)'
  - '(?:私|僕|俺|自分)(?:は|が)\s*(?:人狼|狼)(?:の仲間|陣営)(?:として|です|である)'
  - '(?:私|僕|俺|自分)の(?:陣営|所属)(?:は|が)\s*(?:人狼|狼)'
teammate_claim_patterns:
  - '{teammate}\s*(?:さん)?\s*(?:は|が)\s*(?:私|僕|俺|自分)(?:\s*\([^)]*\))?の(?:人狼)?仲間'
  - '(?:私|僕|俺|自分)の(?:人狼)?仲間(?:は|が)\s*{teammate}'
disclosure_cues:
  open: 本人の役職と受信済み結果を知ったまま、相手の質問に答えてください。結果がなくても昼のCOはでき、本人が受信していない判定は作りません。初夜に行動できない能力の結果を他人にも求めません。
  hide: 正体は今は伏せる局面です。本人の役職と仲間を知ったまま、公開では村側の参加者として推理を話してください。本当の役職・陣営・能力・仲間・騙る狙いは言わないでください。偽COと偽結果は使えます。
  allowed: 今は本人の戦略上COできる局面です。COすべきかは本人の作戦で決めてください。圧力への防御や対抗COなら本人の役職と実際の行動履歴で説明し、終盤の票合わせなら根拠と票先を判断JSONに記し、生存する相手への投票を合わせてください。味方の生存が不明なときは勝ち確定とは言わないでください。
  private: サーバが許可した秘密チャンネルです。ここでは本人の正体と仲間を知ったまま、公開の議論を材料に襲撃・投票の対象と短い理由を仲間と相談してください。秘密の本文を後で公開にコピーしないでください。
