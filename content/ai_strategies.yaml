default:
  disclosure: open
  text: 本人の役職の説明と受信情報に従い、推理・質問・投票で自分の陣営の勝利を目指す。
roles:
  werewolf: &wolf
    disclosure: endgame_vote
    text: >-
      村人として目立たないように振る舞う。強すぎる主張、不自然な沈黙、仲間のかばいすぎを避け、多数の疑いに乗る。
      仲間と夜に相談し、襲撃と投票を合わせる。村側の役職を騙ってよく、名乗る役職と偽の結果は公開発言に使ってよい。
      本当の役職・陣営・自分の襲撃・仲間は普段は明かさず、終盤の票合わせで勝てる局面だけ正体を明かす。
  wise_werewolf: *wolf
  greedy_werewolf: *wolf
  madman: &helper
    disclosure: endgame_vote
    text: >-
      人狼の勝利を助ける。占い師を騙るなど、偽のCOと結果で村を混乱させ、人狼が処刑されないよう投票する。
      知らない人狼の正体を事実として決めつけない。名乗る役職と偽の結果は公開してよい。
      本当の役職・陣営は普段隠し、終盤の票合わせの局面だけ明かす。
  fanatic: *helper
  whispering_madman: *helper
  guard:
    disclosure: pressure
    text: >-
      普段は正体と護衛先を隠し、村側の推理と質問に参加する。
      自分への処刑・投票の呼びかけが出たら、投票前に狩人COし、自分が実際に選んだ護衛先を示して処刑を避ける。
      初日はまだ護衛していないと伝える。対抗狩人COにも自分の役職と護衛履歴で反論する。護衛成功を受信していなければ成功とは言わない。
  seer:
    disclosure: open
    text: >-
      占い師COをして、自分がサーバから受け取った対象と結果を公開する。初夜の結果も公表できる。
      人狼ではない結果でも狂人の可能性は残る。他人のCOは真実と決めつけず、受信していない結果は作らない。
      自分は占い師のまま推理し、他人の役職や発言者IDと取り違えない。
  medium:
    disclosure: open
    text: >-
      霊能者COをして、自分がサーバから受け取った死者の対象と結果を公開する。
      初夜は行動できない。生存者や夜の襲撃で死んだ人は判定できない。霊能の能力で人を殺すこともない。
      受信していない結果は作らず、他人の占い結果を自分の霊能結果にしない。
  villager: &village
    disclosure: open
    text: 特別な能力はない。推理と質問で人狼を探し、他人の発言を受けて根拠を示す。占いや護衛を行ったとは言わない。
  baker:
    disclosure: open
    text: 夜に対象を選ぶ能力はない。サーバのパン配布通知と公開の議論を根拠に推理し、市民陣営の勝利を目指す。
  nekomata:
    disclosure: pressure
    text: 正体は普段隠す。処刑されそうなら役職と道連れの危険を説明して処刑を避け、村の勝利を目指す。
  fox:
    disclosure: hidden
    text: 本当の正体を隠して生き残る。村側として推理し、必要なら村側の役職を騙る。占いと処刑を避ける。
