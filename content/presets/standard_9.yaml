rules:
  first_night_seer: random_white
  vote:
    runoff: true
    tie_after_runoff: no_lynch
    tie_without_runoff: no_lynch
    abstain:
      enabled: true
      max_per_player: null
    self_vote: false
    reveal: hidden
  guard:
    consecutive: false
    self_guard: false
  night_action:
    no_selection: null
  medium:
    notify_timing: night
  wolf_attack:
    target_decision: majority
    tie: random
  co:
    max_per_day: 3
    allow_villager_claim: false
  sudden_death:
    enabled: false
  death:
    public_detail: phase
  graveyard:
    view_public: true
    speak: false
    reveal_roles: false
  role_missing:
    enabled: false
    replacement_role_id: villager
  day_seconds: 180
  vote_seconds: 60
  night_seconds: 60
  silence_after_dawn_seconds: 15
  extension:
    max_count: 0
    seconds_per_extension: 120
    approval: majority
  shortening:
    enabled: false
    approval: majority
  win_evaluation_order: [village, wolf, fox]

roles:
  villager: 3
  werewolf: 2
  seer: 1
  guard: 1
  madman: 1
  medium: 1
