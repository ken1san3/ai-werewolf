id: nekomata
description: "Nekomata. You belong to the village. When you die, your retaliation may kill another player according to the server rules. Find the werewolves and help the village win."
name: 猫又
claimable: true
team: village
attack_result: die
tags: []
knows_teammates: false
chat_channels: [public]
abilities: []
passives:
  - type: retaliate_on_death
    priority: 78
    rules:
      - when:
          death_cause: attacked
        target:
          selector: alive_by_tag
          tag: werewolf
          count: 1
          pick: random
        death_cause: retaliation
      - when:
          death_cause: lynched
        target:
          selector: alive_all
          count: 1
          pick: random
        death_cause: retaliation
    effects: [kill]
options: {}
