[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-werewolf"
version = "0.1.0"
description = "Data-driven core for the AI Werewolf project"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27,<1",
    "PyYAML>=6.0",
    "jsonschema>=4.18",
    "referencing>=0.30",
    "websockets>=14.0",
    "async-timeout>=4,<6; python_version < '3.11'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "completion: separate-process completion and driver integration tests",
    "windows_private: durable private evidence and Windows CPython 3.13 filesystem validation",
]

[tool.setuptools.packages.find]
include = ["server*", "ai_client*"]
