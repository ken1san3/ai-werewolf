[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-werewolf"
version = "0.1.0"
description = "Data-driven core for the AI Werewolf project"
requires-python = ">=3.10"
dependencies = [
    "PyYAML>=6.0",
]

[tool.setuptools.packages.find]
include = ["server*"]
