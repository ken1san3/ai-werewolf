name: One-time scoped CI repair

on:
  push:
    branches: [ci-cleanup-20260918]
    paths: [.github/workflows/ci-cleanup-apply.yml]

permissions:
  contents: write

jobs:
  apply:
    if: github.repository == 'ken1san3/AIwolf' && github.ref == 'refs/heads/ci-cleanup-20260918'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply exact scoped repairs
        run: |
          python - <<'PY'
          import hashlib
          from pathlib import Path
          import subprocess

          def replace_once(text, before, after):
              assert text.count(before) == 1, 'scoped replacement did not match exactly'
              return text.replace(before, after, 1)

          # Fix minimum-dependency job: package import requires runtime dependencies too.
          ci = Path('.github/workflows/ci.yml')
          ci_text = ci.read_text(encoding='utf-8')
          ci_text = replace_once(
              ci_text,
              'run: python -m pip install "jsonschema==4.18" "referencing==0.30"',
              'run: python -m pip install -e "." "jsonschema==4.18" "referencing==0.30" "websockets==14.0"'
          )
          # Emit only safe, allowlisted private-test metadata when the Windows job fails.
          ci_text = replace_once(
              ci_text,
              'from pathlib import Path\n          import subprocess',
              'from pathlib import Path\n          import json\n          import subprocess'
          )
          ci_text = replace_once(
              ci_text,
              'from tests.fixtures.phase6_evidence import create_private_evidence_container',
              'from scripts.ci_private_summary import summarize_private_junit\n          from tests.fixtures.phase6_evidence import create_private_evidence_container'
          )
          ci_text = replace_once(
              ci_text,
              'print("Windows private tests exit:", code)\n          raise SystemExit(code)',
              'print(json.dumps(summarize_private_junit(root, raw / "pytest.xml"), sort_keys=True))\n          print("Windows private tests exit:", code)\n          raise SystemExit(code)'
          )
          ci.write_text(ci_text, encoding='utf-8', newline='\n')

          # The large test module is edited only against the inspected immutable blob.
          path = Path('tests/test_phase5_local_smoke.py')
          assert subprocess.check_output(['git', 'hash-object', str(path)], text=True).strip() == '84e045321ddf2f66fbf68597041064e5ad68cf0b'
          text = path.read_text(encoding='utf-8')
          text = replace_once(
              text,
              '    with patch.object(runner, "_windows_command_line_to_argv", return_value=argv):\n        exact = asyncio.run(runner._observe_windows_process_command_line(123, create_subprocess_exec=create_exact))',
              '    with patch.object(runner.shutil, "which", return_value="powershell.exe"), \\\n         patch.object(runner, "_windows_command_line_to_argv", return_value=argv):\n        exact = asyncio.run(runner._observe_windows_process_command_line(123, create_subprocess_exec=create_exact))'
          )
          text = replace_once(
              text,
              '    with unittest.TestCase().assertRaises(private_review.ReviewFailure):\n        with private_review._locked_path(target, create=True):\n            pass\n    rejected = locked_root / "rejected.jsonl"\n    with patch.object(private_review, "_windows_private_path", return_value=False), \\\n         unittest.TestCase().assertRaises(private_review.ReviewFailure):\n        with private_review._locked_path(rejected, create=True):\n            pass',
              '    collision = private_review.ReviewFailure if os.name == "nt" else FileExistsError\n    with unittest.TestCase().assertRaises(collision):\n        with private_review._locked_path(target, create=True):\n            pass\n    assert target.read_bytes() == b"{}\\n"\n    rejected = locked_root / "rejected.jsonl"\n    if os.name == "nt":\n        with patch.object(private_review, "_windows_private_path", return_value=False), \\\n             unittest.TestCase().assertRaises(private_review.ReviewFailure):\n            with private_review._locked_path(rejected, create=True):\n                pass\n    else:\n        rejected.write_bytes(b"{}\\n")\n        rejected.chmod(0o644)\n        with unittest.TestCase().assertRaises(private_review.ReviewFailure):\n            with private_review._locked_path(rejected):\n                pass'
          )
          compile(text, str(path), 'exec')
          path.write_text(text, encoding='utf-8', newline='\n')

          # Restore original D075 evidence bytes instead of changing expected hashes.
          prefix = 'Docs/ai/history/2026-09-16-before-d075/'
          originals = (
              ('CURRENT_STATE.md', 127, {3,12,16,18,20,21,22,23,24,36,95}, 'c43197e02adcc9ff8fb4aa4ecba02862481c1ad1a37b20ef60ee4451c6685968', '8fd04746e92bb12675542077a21131c419499609a80d91d2b72ea3249f6e4924'),
              ('TASKS.md', 270, set(), '93f829e2b82ba4af4e595ccf9189a81b497cbc4b8920e000936f165acc55c578', '01c3111a7f15cdddc52a49539783df55d1bea09bf403c870ccf7ee8bf46d3c0d'),
          )
          for name, count, lf_only, normalized_hash, original_hash in originals:
              archived = Path(prefix + name)
              normalized = archived.read_bytes().replace(b'\r\n', b'\n')
              assert hashlib.sha256(normalized).hexdigest() == normalized_hash
              lines = normalized.splitlines(keepends=True)
              assert len(lines) == count and all(line.endswith(b'\n') for line in lines)
              restored = b''.join(line if number in lf_only else line[:-1] + b'\r\n' for number, line in enumerate(lines, 1))
              assert hashlib.sha256(restored).hexdigest() == original_hash
              archived.write_bytes(restored)

          attributes = Path('.gitattributes')
          attr = attributes.read_text(encoding='utf-8')
          marker = prefix + 'CURRENT_STATE.md -text'
          if marker not in attr:
              attr += '\n# D075保全原本: 記録済みSHA-256を維持するため改行変換を行わない。\n'
              attr += prefix + 'CURRENT_STATE.md -text\n' + prefix + 'TASKS.md -text\n'
          attributes.write_text(attr, encoding='utf-8', newline='\n')
          PY

      - name: Install test dependencies
        run: python -m pip install -e '.[dev]'
      - name: Check repaired tests before committing
        run: |
          python -m pytest tests/test_ai_status.py tests/test_phase5_local_smoke.py tests/test_ci_private_summary.py -q -m 'not completion and not windows_private'
          python scripts/check_docs.py
          git diff --check -- .gitattributes tests/test_phase5_local_smoke.py .github/workflows/ci.yml
      - name: Commit only scoped changes to the dedicated branch
        run: |
          set -eu
          remote_sha=$(git ls-remote origin refs/heads/ci-cleanup-20260918 | cut -f1)
          test "$remote_sha" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- .github/workflows/ci.yml .gitattributes tests/test_phase5_local_smoke.py Docs/ai/history/2026-09-16-before-d075/CURRENT_STATE.md Docs/ai/history/2026-09-16-before-d075/TASKS.md
          git commit -m 'test(ci): preserve archive bytes and repair platform fixtures'
          git push origin HEAD:refs/heads/ci-cleanup-20260918
