name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Test
        run: python -m pytest -q -m "not completion and not windows_private"

      - name: Verify test selection partition
        if: matrix.python-version == '3.13'
        timeout-minutes: 2
        run: |
          python - <<'PY'
          import contextlib
          import io
          from pathlib import Path
          import pytest

          class Collected:
              def pytest_collection_finish(self, session):
                  self.nodes = {item.nodeid for item in session.items}

          groups = []
          work = Path("logs/ci-collection")
          work.mkdir(parents=True, exist_ok=True)
          for index, selection in enumerate((None, "not completion and not windows_private", "completion and not windows_private", "windows_private")):
              collected = Collected()
              args = ["--collect-only", "-q", "-p", "no:cacheprovider", "--basetemp", str(work / str(index))]
              if selection is not None:
                  args.extend(("-m", selection))
              with contextlib.redirect_stdout(io.StringIO()), contextlib.redirect_stderr(io.StringIO()):
                  code = pytest.main(args, plugins=[collected])
              assert code == 0, (selection, code)
              groups.append(collected.nodes)
          all_nodes, normal, completion, private = groups
          assert normal | completion | private == all_nodes
          assert not (normal & completion or normal & private or completion & private)
          required = "tests/test_phase6_semantic_completion.py::test_p6f_nine_client_semantic_completion"
          assert required in private
          assert {node for node in private if node.startswith("tests/test_phase6_semantic_completion.py::")} == {required}
          print("Test selection partition verified:", *(len(group) for group in groups))
          PY

  completion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Completion tests
        run: python -m pytest -q -m "completion and not windows_private"

  windows-private:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Windows private evidence tests
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          import json
          import subprocess
          import sys
          from scripts.ci_private_summary import summarize_private_junit
          from tests.fixtures.phase6_evidence import create_private_evidence_container

          root = Path.cwd()
          work = root / "logs" / "ci-private-work"
          work.mkdir(parents=True, exist_ok=False)
          basetemp = work / "pytest-basetemp"
          base = root / "logs" / "phase6-private-evidence"
          base.mkdir(parents=True, exist_ok=True, mode=0o700)
          raw = create_private_evidence_container(base, pytest_basetemp=basetemp)
          argv = [sys.executable, "-m", "pytest", "-q", "-x", "-m", "windows_private", "-p", "no:cacheprovider", "--basetemp", str(basetemp), "--junitxml", str(raw / "pytest.xml")]
          with (raw / "stdout.raw").open("xb") as out, (raw / "stderr.raw").open("xb") as err:
              process = subprocess.Popen(argv, stdout=out, stderr=err, creationflags=subprocess.CREATE_NEW_PROCESS_GROUP)
              try:
                  code = process.wait(timeout=1500)
              except subprocess.TimeoutExpired:
                  subprocess.run(["taskkill", "/PID", str(process.pid), "/T", "/F"], stdout=out, stderr=err, timeout=10, check=False)
                  if process.poll() is None:
                      process.kill()
                  process.wait(timeout=10)
                  raise
          print(json.dumps(summarize_private_junit(root, raw / "pytest.xml"), sort_keys=True))
          print("Windows private tests exit:", code)
          raise SystemExit(code)
          '@ | python -

  protocol-schema-minimum:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install minimum schema-test dependencies
        run: python -m pip install -e "." "jsonschema==4.18" "referencing==0.30" "websockets==14.0"
      - name: Test protocol schema at dependency minimums
        run: python -m unittest tests.test_protocol_schema

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check documentation consistency
        run: python scripts/check_docs.py

  content:
    # 役職の追加が Python の変更を伴わないことを、content の読み込みだけで確認する
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e "."
      - name: Load content pack
        run: |
          python - <<'PY'
          from pathlib import Path

          from server.aiwolf_core.content import load_content, load_preset

          content = load_content("content")
          load_preset("content/presets/standard_9.yaml", content)

          # 期待値は content/roles/ の実ファイルから導出する。
          # 役職数を直値で持つと、YAML だけの役職追加で CI が落ち、
          # 「役職追加に Python の変更は要らない」という性質を壊してしまう。
          declared = {path.stem for path in Path("content/roles").glob("*.yaml")}
          loaded = set(content.roles)
          missing = declared - loaded
          extra = loaded - declared

          print(f"roles={len(loaded)} teams={len(content.teams)}")
          assert not missing, f"declared but not loaded: {sorted(missing)}"
          assert not extra, f"loaded but not declared as a file: {sorted(extra)}"
          assert declared, "content/roles/ must declare at least one role"
          PY
