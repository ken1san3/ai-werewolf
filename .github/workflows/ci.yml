name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Test
        run: python -m pytest -q

  content:
    # 役職の追加が Python の変更を伴わないことを、content の読み込みだけで確認する
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e "."
      - name: Load content pack
        run: |
          python - <<'PY'
          from server.aiwolf_core.content import load_content, load_preset
          content = load_content("content")
          load_preset("content/presets/standard_9.yaml", content)
          print(f"roles={len(content.roles)} teams={len(content.teams)}")
          assert len(content.roles) == 13, "expected 13 roles"
          PY
