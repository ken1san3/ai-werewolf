name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Test
        run: python -m pytest -q

  protocol-schema-minimum:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install minimum schema-test dependencies
        run: python -m pip install "jsonschema==4.18" "referencing==0.30"
      - name: Test protocol schema at dependency minimums
        run: python -m unittest tests.test_protocol_schema

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check documentation consistency
        run: python scripts/check_docs.py

  content:
    # 役職の追加が Python の変更を伴わないことを、content の読み込みだけで確認する
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e "."
      - name: Load content pack
        run: |
          python - <<'PY'
          from pathlib import Path

          from server.aiwolf_core.content import load_content, load_preset

          content = load_content("content")
          load_preset("content/presets/standard_9.yaml", content)

          # 期待値は content/roles/ の実ファイルから導出する。
          # 役職数を直値で持つと、YAML だけの役職追加で CI が落ち、
          # 「役職追加に Python の変更は要らない」という性質を壊してしまう。
          declared = {path.stem for path in Path("content/roles").glob("*.yaml")}
          loaded = set(content.roles)
          missing = declared - loaded
          extra = loaded - declared

          print(f"roles={len(loaded)} teams={len(content.teams)}")
          assert not missing, f"declared but not loaded: {sorted(missing)}"
          assert not extra, f"loaded but not declared as a file: {sorted(extra)}"
          assert declared, "content/roles/ must declare at least one role"
          PY
